<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Munich &amp; Bavaria</title>
  <meta name="description" content="A regional photo log of Munich and Bavaria.">
  <meta name="theme-color" content="#0a0f1c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="travel-assets/travel.css">
</head>
<body class="page-map">
  <div id="site-header"></div>

  <main class="map-shell">
    <aside class="panel" id="panel" aria-label="Places">
      <div class="panel__head">
        <p class="kicker" id="p-kicker"></p>
        <h1 class="display" id="p-title"></h1>
        <p class="panel__stats" id="p-stats"></p>
        <div class="panel__links"><a class="btn" id="p-back" href="travel1.html"></a></div>
        <label class="search"><span class="sr-only" id="p-searchlabel"></span><input id="search" type="search" autocomplete="off"></label>
      </div>
      <div class="panel__list" id="list"></div>
    </aside>

    <div id="map" class="map" role="region" aria-label="Map"></div>

    <div class="map-tools">
      <button type="button" class="btn btn--glass" id="panel-toggle"></button>
      <button type="button" class="btn btn--glass" id="reset"></button>
    </div>
  </main>

  <noscript><p style="padding:24px">This page needs JavaScript.</p></noscript>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="travel-assets/travel-data.js"></script>
  <script src="travel-assets/manifest.js"></script>
  <script src="travel-assets/travel-core.js"></script>
  <script src="travel-assets/travel-map.js"></script>
  <script>
  (function () {
    var C = window.TravelCore, D = window.TRAVEL;
    var $ = function (id) { return document.getElementById(id); };
    var view;

    function text() {
      document.title = C.ui('bavTitle') + ' · ' + C.ui('brand');
      $('p-kicker').textContent = C.ui('bavKicker');
      $('p-title').textContent = C.ui('bavTitle');
      $('search').placeholder = C.ui('search');
      $('search').setAttribute('aria-label', C.ui('search'));
      $('p-searchlabel').textContent = C.ui('search');
      $('reset').textContent = C.ui('resetView');
      $('panel-toggle').textContent = C.ui('destinations');
      $('p-back').textContent = '← ' + C.ui('backToMap');
      $('p-stats').textContent = D.bavaria.cities.length + ' · ' + C.ui('nPhotos')(C.countryCount(D.bavaria));
    }

    C.init({
      active: 'bavaria',
      onLang: function () { text(); if (view) view.refresh(); }
    });
    text();

    view = TravelMap.init({
      el: 'map', panel: 'panel', list: 'list', search: 'search', toggle: 'panel-toggle', reset: 'reset',
      countries: [D.bavaria], cityZoom: 0, fitMaxZoom: 9,
      onData: text
    });
  })();
  </script>
</body>
</html>
