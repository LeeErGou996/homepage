<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel Journal</title>
  <meta name="description" content="A growing archive of cities, trips and photos.">
  <meta name="theme-color" content="#0a0f1c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="travel-assets/travel.css">
</head>
<body class="page-journal">
  <div id="site-header"></div>

  <main class="wrap">
    <section class="hero">
      <p class="kicker" id="h-kicker"></p>
      <h1 class="display" id="h-title"></h1>
      <p class="hero__sub" id="h-sub"></p>
      <div class="hero__row">
        <dl class="stats" id="h-stats"></dl>
        <a class="btn btn--primary" href="travel1.html" id="h-map"></a>
      </div>
    </section>

    <div class="strip" id="strip" aria-hidden="true"></div>

    <section class="section">
      <h2 class="section__title display" id="t-title"></h2>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <section class="section">
      <h2 class="section__title display" id="a-title"></h2>
      <div class="atlas" id="atlas"></div>
    </section>

    <footer class="foot" id="foot"></footer>
  </main>

  <noscript><p style="padding:24px">This page needs JavaScript to show the photo archive.</p></noscript>

  <script src="travel-assets/travel-data.js"></script>
  <script src="travel-assets/manifest.js"></script>
  <script src="travel-assets/travel-core.js"></script>
  <script>
  (function () {
    var C = window.TravelCore, D = window.TRAVEL;
    var $ = function (id) { return document.getElementById(id); };

    function dateParts(trip) {
      if (!trip.from) return { year: '', dates: C.ui('dateTba'), tba: true };
      var a = trip.from.split('-').map(Number), b = trip.to.split('-').map(Number);
      var year = a[0] === b[0] ? String(a[0]) : a[0] + '–' + b[0];
      return { year: year, dates: trip.from === trip.to ? a[1] + '.' + a[2] : a[1] + '.' + a[2] + ' – ' + b[1] + '.' + b[2] };
    }

    function cover(country) {
      var list = C.manifest[country.folder] || [];
      if (!list.length) return '';
      return C.thumb(list[Math.floor(list.length / 3)].p, 560);
    }

    function render() {
      document.title = C.ui('journalKicker') + ' · ' + C.ui('brand');
      $('h-kicker').textContent = C.ui('journalKicker');
      $('h-title').textContent = C.ui('journalTitle');
      $('h-sub').textContent = C.ui('journalSub');
      $('h-map').textContent = C.ui('openMap') + ' →';
      $('t-title').textContent = C.ui('timeline');
      $('a-title').textContent = C.ui('atlas');
      $('foot').textContent = C.ui('credit');

      var s = C.stats();
      $('h-stats').innerHTML = [
        [s.countries, 'statCountries'], [s.cities, 'statCities'], [s.photos, 'statPhotos']
      ].map(function (x) { return '<div class="stat"><dt>' + C.esc(C.ui(x[1])) + '</dt><dd>' + x[0] + '</dd></div>'; }).join('');

      /* photo strip: one picture per country that already has photos */
      $('strip').innerHTML = D.countries.filter(function (c) { return C.countryCount(c) > 0 && cover(c); })
        .slice(0, 12).map(function (c) {
          return '<div class="strip__item"><img loading="lazy" alt="" src="' + cover(c) + '"></div>';
        }).join('');

      /* timeline */
      $('timeline').innerHTML = D.trips.map(function (t) {
        var d = dateParts(t);
        var chips = t.places.map(function (p) {
          var country = C.getCountry(p[0]), city = C.getCity(country, p[1]);
          var n = C.cityCount(country, city);
          var label = C.swatch(country) + C.esc(C.tr(city.name)) + (n && city.folder ? ' <small>' + n + '</small>' : '');
          return n
            ? '<button type="button" class="chip" data-open="' + p[0] + ':' + p[1] + '">' + label + '</button>'
            : '<span class="chip is-static">' + label + '</span>';
        }).join('');
        var note = t.note ? (t.note[C.lang()] || t.note.en) : '';
        var actions = '';
        if (t.pdf) actions += '<a class="btn" href="' + t.pdf + '" target="_blank" rel="noopener">' + C.esc(C.ui('pdf')) + '</a>';
        if (t.link) actions += '<a class="btn" href="' + t.link + '">' + C.esc(C.ui('bavariaLog')) + ' →</a>';
        return '<li class="trip"><div class="trip__when"><span class="trip__year">' + d.year + '</span><span class="trip__dates' + (d.tba ? ' is-tba' : '') + '">' + C.esc(d.dates) + '</span></div>' +
          '<article class="trip__card"><h3 class="display">' + C.esc(C.tr(t.title)) + '</h3><div class="chips">' + chips + '</div>' +
          (note ? '<p class="trip__note">' + C.esc(note) + '</p>' : '') +
          (actions ? '<div class="trip__actions">' + actions + '</div>' : '') + '</article></li>';
      }).join('');

      /* atlas: countries with photos first, reserved ones last */
      var sorted = D.countries.slice().sort(function (a, b) { return (C.countryCount(b) > 0) - (C.countryCount(a) > 0); });
      $('atlas').innerHTML = sorted.map(function (c) {
        var n = C.countryCount(c), cv = cover(c);
        var names = c.cities.map(function (ci) { return C.tr(ci.name); }).join(' · ');
        if (!n) {
          return '<div class="dest is-pending" style="' + C.colorStyle(c) + '"><span class="dest__cover"></span><span class="dest__body"><strong>' + C.swatch(c) + C.esc(C.tr(c.name)) +
            '</strong><small>' + C.esc(names) + '</small><small>' + C.esc(C.ui('soon')) + '</small></span></div>';
        }
        return '<button type="button" class="dest" style="' + C.colorStyle(c) + '" data-open="' + c.id + '"><span class="dest__cover"' +
          (cv ? ' style="background-image:url(\'' + cv + '\')"' : '') + '></span><span class="dest__body"><strong>' + C.swatch(c) + C.esc(C.tr(c.name)) +
          '</strong><small>' + C.esc(C.ui('nPhotos')(n)) + ' · ' + C.esc(C.ui('nCities')(c.cities.length)) + '</small></span></button>';
      }).join('');
    }

    document.addEventListener('click', function (e) {
      var b = e.target.closest('[data-open]');
      if (!b) return;
      var parts = b.getAttribute('data-open').split(':');
      var country = C.getCountry(parts[0]);
      C.openCountryGallery(country, parts[1] ? C.getCity(country, parts[1]) : null);
    });

    C.init({ active: 'journal', onLang: render });
    render();
    C.hydrate(D.countries).then(render);   // picks up photos not yet listed in manifest.js
  })();
  </script>
</body>
</html>
